<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { display: grid; height: 100vh; }
      canvas { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font: 12px ui-monospace, monospace; color: #9aa5b1;
        background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="hud"></div>
    <script type="module" src="/src/app/scenePreview.ts"></script>
  </body>
</html>
