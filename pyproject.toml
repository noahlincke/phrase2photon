[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phrase2photon"
version = "0.1.0"
description = "Phrase-indexed Ableton show compiler and code-native visuals runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "json5>=0.9,<1",
  "mutagen>=1.47,<2",
  "pydantic>=2.7,<3",
  "pyrekordbox>=0.4,<0.5; platform_system == 'Darwin'",
  "sqlcipher3-wheels>=0.5,<0.6; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
phrase2photon = "phrase2photon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
